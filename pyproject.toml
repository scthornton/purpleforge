[project]
name = "purpleforge"
version = "0.1.0"
description = "Evidence-driven purple team pipeline for SANS SEC598"
requires-python = ">=3.11"
authors = [{name = "Scott Thornton", email = "scott@perfecxion.ai"}]

dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-chroma>=0.2",
    "langchain-text-splitters>=0.3",
    "chromadb>=0.5",
    "pypdf>=4.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pywinrm>=0.4.3",
    "mitreattack-python>=3.0",
    "tenacity>=9.0",
    "click>=8.1",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
github = [
    "PyGithub>=2.5",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.scripts]
purpleforge = "purpleforge.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/purpleforge"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["purpleforge"]
mypy_path = "src"
